[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-mpmath"
version = "0.1.0"
description = "Exact arbitrary-precision integer kernels in Mojo"
readme = "README.md"
license = "MIT"
authors = [{name = "Lee Penkman"}]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/lee101/mojo-mpmath"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
